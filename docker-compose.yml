services:
  # Optional — skipped by default. If you already have an Ollama instance running on
  # this server (systemd install or your own container), leave this out entirely and
  # point OLLAMA_BASE_URL in .env at it instead (see .env.example and
  # infra/ollama/README.md, "Bereits vorhandene Ollama-Instanz nutzen"). Only start
  # this bundled one with `docker compose --profile bundled-ollama up -d ollama`.
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    container_name: ownai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ownai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ownai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: ownai-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env reach an Ollama
    # instance running directly on this host (native install or your own container
    # publishing port 11434) — needed on Linux, where host.docker.internal isn't
    # resolvable by default the way it is on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./web
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time by Next.js,
      # not read at container start — must be passed as a build arg, not `environment:`
      # (see web/README.md, "NEXT_PUBLIC_API_BASE_URL gotcha").
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}/api/v1
    container_name: ownai-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: ownai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - backend
      - web

volumes:
  ollama_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
