services:
  postgres:
    image: postgres:16-alpine
    container_name: ownai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ownai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: ownai-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env reach an Ollama
    # instance running directly on this host (native install or your own container
    # publishing port 11434) — needed on Linux, where host.docker.internal isn't
    # resolvable by default the way it is on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persists assistant-generated files (create_file tool) across container restarts —
      # matches FILES_STORAGE_DIR's default (./data/files, relative to the Dockerfile's
      # WORKDIR /app) in .env.example.
      - backend_files:/app/data/files

  web:
    build:
      context: ./web
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time by Next.js,
      # not read at container start — must be passed as a build arg, not `environment:`
      # (see web/README.md, "NEXT_PUBLIC_API_BASE_URL gotcha").
      # Set NEXT_PUBLIC_API_BASE_URL in .env to whatever address your browser will
      # actually use to reach the backend — through Caddy (https://DOMAIN/api/v1) or
      # directly by IP/Tailscale-host and BACKEND_PORT (http://host:8000/api/v1).
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://${DOMAIN}/api/v1}
    container_name: ownai-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Optional: only needed if you don't already run your own reverse proxy in front of this
  # host. Not started by a plain `docker compose up -d` — it binds :80/:443, which conflicts
  # with an existing Nginx/Apache/etc. Start it explicitly with `--profile caddy` if you want
  # it; otherwise point your own reverse proxy at backend:8000 (/api/*) and web:3000 (see
  # infra/caddy/Caddyfile for the exact routing to replicate).
  caddy:
    image: caddy:2-alpine
    container_name: ownai-caddy
    restart: unless-stopped
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backend_files:
